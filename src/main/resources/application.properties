spring.application.name=tp1-favoritos
server.port=${PORT:8080}

# ===== Servicio externo DummyJSON =====
app.dummyjson.base-url=https://dummyjson.com

# ===== Base de datos PostgreSQL (defaults alineados con docker-compose.yml) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tp2db}
spring.datasource.username=${DB_USER:tp2user}
spring.datasource.password=${DB_PASSWORD:tp2pass}

# Hibernate: "validate" verifica el schema contra las entidades (Flyway gestiona las migraciones)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Propiedades JWT (nombres directos según enunciado TP3) =====
jwt.secret=${JWT_SECRET:clave-secreta-por-defecto-cambiar-en-produccion-minimo-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Alias para compatibilidad con app.jwt.* =====
app.jwt.secret=${jwt.secret}
app.jwt.expiration-ms=${jwt.expiration}
